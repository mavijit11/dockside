<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ask Dockside | Dockside Paddle Co.</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            background: #f1f6f5;
            color: #183b3a;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }

        .container {
            max-width: 650px;
            width: 100%;
            background: white;
            padding: 48px 32px;
            border-radius: 18px;
            text-align: center;
            box-shadow: 0 8px 30px rgba(0,0,0,0.07);
        }

        .tag {
            color: #087e75;
            font-size: 13px;
            font-weight: bold;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        h1 {
            font-size: 42px;
            margin: 18px 0 12px;
        }

        p {
            color: #617775;
            line-height: 1.7;
        }

        .status {
            display: inline-block;
            margin-top: 22px;
            padding: 10px 18px;
            border-radius: 30px;
            background: #e3f4ef;
            color: #087e75;
            font-size: 14px;
        }

        footer {
            margin-top: 35px;
            font-size: 12px;
            color: #91a5a2;
        }
    </style>
</head>
<body>
    <main class="container">
        <div class="tag">Dockside Paddle Co. · Dublin</div>
        <h1>Ask Dockside</h1>
        <p>Your guide to watersports, activities and experiences at Grand Canal Dock.</p>
        <div class="status">Chatbot coming soon</div>
        <footer>Created by Avijit Mondal · 2026</footer>
    </main>
</body>
</html>
